name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler:
          - gcc
          - clang

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang

      - name: Build
        run: |
          make CC=${{ matrix.compiler }}

      - name: Verify binary
        run: |
          test -x meu-comando

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: meu-comando-${{ matrix.compiler }}
          path: meu-comando
